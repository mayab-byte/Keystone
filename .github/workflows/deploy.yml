name: Deploy to GitHub Pages

on:
  push:
    # GitHub Pages deploys only from the repo's default branch (environment gate).
    branches: [claude/keystone-repo-setup-dxydmb]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress production deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages (enables Pages on first run)
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # Served at the root of the custom domain (keystonefinance.co.il), so
          # NO basePath. Real domain → canonical URLs + indexable for search.
          NEXT_PUBLIC_SITE_URL: https://keystonefinance.co.il
          NEXT_PUBLIC_INDEXABLE: "true"
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
